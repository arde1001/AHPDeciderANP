[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionmaker"
version = "1.2.0"
description = "AHP and ANP multi-criteria decision making with a Qt GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "arde1001" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "numpy>=1.24", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
decisionmaker = "decisionmaker.gui.app:main"

[tool.setuptools.packages.find]
include = ["decisionmaker*"]

[tool.setuptools.package-data]
decisionmaker = ["examples/*.json", "gui/icon.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
